<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="印尼話翻譯">
<title>印尼話翻譯</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f5f3f1;--card:#fff;--text:#1d1b1a;--sub:#6d6763;--line:#e6e1dd;--red:#c8102e;--blue:#1565c0;--me:#fff;--them:#fff3f3}
@media (prefers-color-scheme:dark){:root{--bg:#141212;--card:#1f1c1b;--text:#eeeae7;--sub:#a39c97;--line:#332e2c;--red:#e5404f;--blue:#5aa2ef;--me:#1f1c1b;--them:#2a1d1f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--red);color:#fff}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
#log{flex:1;overflow:auto;padding:12px 12px 6px}
.empty{color:var(--sub);text-align:center;font-size:15px;line-height:1.7;padding:40px 16px}
.empty b{color:var(--text)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 10px;max-width:92%}
.msg.zh{margin-right:auto;border-top-left-radius:4px}
.msg.id{margin-left:auto;background:var(--them);border-top-right-radius:4px}
.msg .src{font-size:14px;color:var(--sub);line-height:1.5}
.msg .dst{font-size:21px;font-weight:600;line-height:1.45;margin-top:6px;word-break:break-word}
.msg .tool{display:flex;gap:6px;margin-top:8px;align-items:center}
.msg .tool span{font-size:12px;color:var(--sub);flex:1}
.msg .tool button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px}
.msg.live .dst{color:var(--sub);font-weight:400}
#status{min-height:22px;text-align:center;font-size:14px;color:var(--sub);padding:2px 12px}
#status.err{color:var(--red)}
.pad{display:flex;gap:10px;padding:8px 12px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
.talk{flex:1;border:0;border-radius:22px;padding:18px 8px 16px;color:#fff;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(0,0,0,.15);transition:transform .1s}
.talk:active{transform:scale(.97)}
.talk small{font-size:13px;font-weight:400;opacity:.9}
.talk .mic{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.talk svg{width:26px;height:26px;fill:#fff}
#bzh{background:var(--blue)}
#bid{background:var(--red)}
.talk.rec{animation:pulse 1.1s infinite}
.talk.rec .mic{background:#fff}
.talk.rec svg{fill:currentColor}
#bzh.rec svg{fill:var(--blue)}#bid.rec svg{fill:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,16,46,.5)}100%{box-shadow:0 0 0 18px rgba(200,16,46,0)}}
.type{display:flex;gap:8px;padding:0 12px 4px}
.type input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:10px 12px;font-size:16px}
.type button{border:0;border-radius:12px;padding:0 14px;font-size:15px;background:var(--card);color:var(--text);border:1px solid var(--line)}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--text)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:18px}
dialog label{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
dialog select,dialog input[type=range]{width:100%}
dialog select{padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:15px}
.ck{display:flex;align-items:center;gap:8px;color:var(--text)!important;font-size:15px!important}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.row button{border:0;border-radius:10px;padding:10px 16px;font-size:15px;background:var(--bg);color:var(--text)}
.row button.pri{background:var(--red);color:#fff}
#inapp{display:none;background:#fff4d6;color:#5a4300;padding:10px 14px;font-size:14px;line-height:1.5;border-bottom:1px solid #f0d98a}
#inapp a{display:inline-block;margin-top:6px;background:var(--red);color:#fff;text-decoration:none;border-radius:10px;padding:8px 14px;font-weight:600}
@media (prefers-color-scheme:dark){#inapp{background:#3a3010;color:#f3e2a6;border-color:#5a4a18}}
.hint{font-size:12px;color:var(--sub);line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>印尼話翻譯 <span style="font-weight:400;font-size:14px;opacity:.85">Penerjemah</span></h1>
  <button id="clr" title="清除">清除</button>
  <button id="set" title="設定">設定</button>
</header>

<div id="inapp"></div>
<div id="log"><div class="empty" id="empty">按下面的按鈕直接開口說，<br>說完會自動翻譯並<b>唸出來</b>。<br><br>🇹🇼 藍色：我說中文 → 印尼話<br>🇮🇩 紅色：對方說印尼話 → 中文</div></div>
<div id="status"></div>
<form class="type" id="tf"><input id="ti" placeholder="也可以打字（自動判斷中文或印尼文）" autocomplete="off" enterkeyhint="send"><button>翻譯</button></form>
<div class="pad">
  <button class="talk" id="bzh"><span class="mic"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></span>說中文<small>→ 印尼話</small></button>
  <button class="talk" id="bid"><span class="mic"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></span>Bahasa Indonesia<small>→ 中文</small></button>
</div>

<dialog id="dlg">
  <h2>設定</h2>
  <label class="ck"><input type="checkbox" id="auto" checked> 翻譯完自動唸出來</label>
  <label>印尼話語音</label><select id="vid"></select>
  <label>中文語音</label><select id="vzh"></select>
  <label>語速 <span id="rv"></span></label><input type="range" id="rate" min="0.6" max="1.3" step="0.05" value="0.95">
  <div class="hint">語音清單來自手機內建的語音。選「Google 線上語音」最穩定；若手機有「進階 / 自然」語音，聲音會更像真人。iPhone 可到 設定 → 輔助使用 → 朗讀內容 → 聲音 下載更好的印尼語音。</div>
  <div class="row"><button id="test">試聽</button><button class="pri" id="ok">完成</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
// ---------- 偵測 LINE / FB 等 App 內建瀏覽器（不能用麥克風）→ 改用 Chrome / Safari 開 ----------
const UA = navigator.userAgent;
const isAndroid = /Android/i.test(UA), isIOS = /iPhone|iPad|iPod/i.test(UA);
const inLine = /\bLine\//i.test(UA);
const inApp = inLine || /FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|Messenger|KAKAOTALK|; wv\)/i.test(UA);
const APP_URL = location.origin + location.pathname;
if (inLine && !/openExternalBrowser=1/.test(location.search)) {
  // LINE 支援這個參數：會自動改用手機預設瀏覽器打開
  location.replace(APP_URL + '?openExternalBrowser=1');
}
function showInApp() {
  const b = document.getElementById('inapp'); if (!b) return;
  const chrome = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;end';
  b.innerHTML = isAndroid
    ? '⚠️ 你現在是在 App 內建的瀏覽器裡，這裡不能用麥克風。<br><a href="' + chrome + '">用 Chrome 打開</a>'
    : '⚠️ 你現在是在 App 內建的瀏覽器裡，這裡不能用麥克風。<br>請按右下角或右上角的「⋯」→「用 Safari 開啟」。';
  b.style.display = 'block';
}
if (inApp) addEventListener('DOMContentLoaded', showInApp);

const LANG = {
  zh: {rec: 'zh-TW', tr: 'zh-TW', tts: 'zh-TW', gtts: 'zh-TW', name: '中文'},
  id: {rec: 'id-ID', tr: 'id', tts: 'id-ID', gtts: 'id', name: '印尼話'}
};
const other = l => l === 'zh' ? 'id' : 'zh';
const store = {
  get(k, d) { try { const v = localStorage.getItem('indo-' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('indo-' + k, JSON.stringify(v)); } catch {} }
};
let cfg = Object.assign({auto: true, rate: 0.95, vid: '', vzh: ''}, store.get('cfg', {}));
let hist = store.get('hist', []);

// ---------- 畫面 ----------
const log = $('#log');
function status(t, err) { const s = $('#status'); s.textContent = t || ''; s.className = err ? 'err' : ''; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bubble(h) {
  $('#empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + h.from;
  d.innerHTML = `<div class="src">${esc(h.src)}</div><div class="dst">${esc(h.dst)}</div>
    <div class="tool"><span>${h.from === 'zh' ? '中文 → 印尼話' : '印尼話 → 中文'}</span><button data-a="say">🔊 再唸一次</button><button data-a="copy">複製</button></div>`;
  d.querySelector('[data-a=say]').onclick = () => speak(h.dst, other(h.from));
  d.querySelector('[data-a=copy]').onclick = e => { navigator.clipboard?.writeText(h.dst); e.target.textContent = '已複製'; setTimeout(() => e.target.textContent = '複製', 1200); };
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
hist.forEach(bubble);
$('#clr').onclick = () => { if (!hist.length || confirm('清除所有翻譯紀錄？')) { hist = []; store.set('hist', hist); log.innerHTML = ''; status(''); } };

// ---------- 翻譯（Google 翻譯，免金鑰） ----------
async function translate(text, from) {
  const to = other(from);
  const u = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + LANG[from].tr + '&tl=' + LANG[to].tr + '&q=' + encodeURIComponent(text);
  let r;
  for (let i = 0; i < 3; i++) { // 偶爾會失敗，自動重試
    try { r = await fetch(u); if (r.ok) break; } catch (e) { if (i === 2) throw e; }
    await new Promise(z => setTimeout(z, 400 * (i + 1)));
  }
  if (!r || !r.ok) throw new Error('翻譯服務暫時無法使用，請再試一次');
  const j = await r.json();
  return j[0].map(x => x[0]).join('').trim();
}

// ---------- 語音合成 ----------
const synth = window.speechSynthesis;
let voices = [];
function score(v) {
  const n = v.name.toLowerCase(); let s = 0;
  if (/natural|neural|premium|enhanced|online/.test(n)) s += 4;
  if (/google/.test(n)) s += 3;
  if (!v.localService) s += 1;
  return s;
}
function voicesFor(l) {
  return voices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(l === 'id' ? 'id' : 'zh') || (l === 'id' && v.lang.toLowerCase().startsWith('in')))
    .sort((a, b) => {
      if (l === 'zh') { const tw = x => /tw|hant/i.test(x.lang) ? 2 : /hk/i.test(x.lang) ? 0 : 1; if (tw(b) !== tw(a)) return tw(b) - tw(a); }
      return score(b) - score(a);
    });
}
function loadVoices() {
  voices = synth ? synth.getVoices() : [];
  for (const l of ['id', 'zh']) {
    const sel = $('#v' + l), list = voicesFor(l);
    sel.innerHTML = '<option value="">自動（最佳）</option>' + list.map(v => `<option value="${esc(v.name)}">${esc(v.name)}（${v.lang}）</option>`).join('') + '<option value="__g">Google 線上語音</option>';
    sel.value = cfg['v' + l] || '';
    if (sel.value !== (cfg['v' + l] || '')) sel.value = '';
  }
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }

const audio = new Audio();
function gtts(text, l) {
  // 分段：Google 線上語音一次最多約 200 字
  const parts = text.match(/[^。！？.!?,，]{1,180}[。！？.!?,，]?/g) || [text];
  let i = 0;
  return new Promise(res => {
    const next = () => {
      if (i >= parts.length) return res(true);
      audio.src = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + LANG[l].gtts + '&ttsspeed=' + Math.min(1, cfg.rate) + '&q=' + encodeURIComponent(parts[i++]);
      audio.onended = next; audio.onerror = () => res(false);
      audio.play().catch(() => res(false));
    };
    next();
  });
}
async function speak(text, l) {
  stopSpeak();
  const pick = cfg['v' + l];
  const list = voicesFor(l);
  const v = pick === '__g' ? null : (list.find(x => x.name === pick) || list[0]);
  if (synth && v) {
    const u = new SpeechSynthesisUtterance(text);
    u.voice = v; u.lang = v.lang; u.rate = cfg.rate;
    synth.speak(u);
    return;
  }
  const ok = await gtts(text, l);
  if (!ok && synth) { // 線上語音失敗時，最後用系統預設
    const u = new SpeechSynthesisUtterance(text); u.lang = LANG[l].tts; u.rate = cfg.rate; synth.speak(u);
  }
}
function stopSpeak() { synth?.cancel(); audio.pause(); }
let unlocked = false;
function unlockAudio() { // iPhone 需要在點擊當下先啟動一次發聲，之後才允許自動唸
  if (unlocked) return; unlocked = true;
  try { if (synth) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } } catch {}
  try { audio.muted = true; audio.play().catch(() => {}).finally(() => { audio.muted = false; }); } catch {}
}

// ---------- 主流程 ----------
async function handle(text, from) {
  text = text.trim(); if (!text) return;
  status('翻譯中…');
  try {
    const dst = await translate(text, from);
    const h = {from, src: text, dst, t: Date.now()};
    hist.push(h); if (hist.length > 100) hist = hist.slice(-100);
    store.set('hist', hist);
    bubble(h);
    status('');
    if (cfg.auto) speak(dst, other(from));
  } catch (e) {
    status(navigator.onLine ? (e.message || '翻譯失敗，請再試一次') : '目前沒有網路，無法翻譯', true);
  }
}

// ---------- 語音辨識 ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recLang = null, finalText = '', liveEl = null;
function setBtn() { $('#bzh').classList.toggle('rec', recLang === 'zh'); $('#bid').classList.toggle('rec', recLang === 'id'); }
function liveBubble(from) {
  $('#empty')?.remove();
  liveEl = document.createElement('div');
  liveEl.className = 'msg live ' + from;
  liveEl.innerHTML = `<div class="src">${from === 'zh' ? '🎙️ 正在聽中文…' : '🎙️ Silakan bicara…'}</div><div class="dst"></div>`;
  log.appendChild(liveEl); log.scrollTop = log.scrollHeight;
}
function start(from) {
  unlockAudio();
  stopSpeak();
  if (rec) { const was = recLang; rec.stop(); if (was === from) return; } // 再按一次 = 說完了
  if (!SR) { status('這個瀏覽器不支援語音辨識，請用 Chrome（Android）或 Safari（iPhone）開啟，或改用打字', true); return; }
  const r = new SR();
  r.lang = LANG[from].rec; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  rec = r; recLang = from; finalText = ''; setBtn(); liveBubble(from);
  status(from === 'zh' ? '請說中文，說完會自動翻譯（再按一次可提早結束）' : 'Silakan bicara dalam Bahasa Indonesia');
  r.onresult = e => {
    let fin = '', tmp = '';
    for (let i = 0; i < e.results.length; i++) (e.results[i].isFinal ? (fin += e.results[i][0].transcript) : (tmp += e.results[i][0].transcript));
    finalText = fin;
    if (liveEl) liveEl.querySelector('.dst').textContent = fin + tmp;
    r._last = fin + tmp;
  };
  r.onerror = e => {
    const deny = inApp ? '這個 App 內建的瀏覽器不能用麥克風，請照上方提示改用 ' + (isIOS ? 'Safari' : 'Chrome') + ' 開啟' : isIOS ? '麥克風被擋住了：請到 設定 → Safari → 麥克風 → 允許，然後重新整理' : '麥克風被擋住了：請點網址列左邊的圖示 → 權限 → 麥克風 → 允許，然後重新整理';
    const m = {'not-allowed': deny, 'service-not-allowed': deny, 'no-speech': '沒有聽到聲音，請再按一次', 'network': '語音辨識需要網路', 'audio-capture': '找不到麥克風'}[e.error];
    if (e.error !== 'aborted') status(m || ('語音辨識錯誤：' + e.error), true);
    if (inApp && /not-allowed/.test(e.error)) showInApp();
    r._err = true;
    if (rec === r) { liveEl?.remove(); liveEl = null; rec = null; recLang = null; setBtn(); }
  };
  r.onend = () => {
    if (rec !== r) return;
    const text = (finalText || r._last || '').trim();
    liveEl?.remove(); liveEl = null;
    rec = null; recLang = null; setBtn();
    if (text) handle(text, from);
    else if (!r._err) status('沒有聽到內容，請再按一次');
  };
  try { r.start(); } catch (e) { status('無法啟動麥克風：' + e.message, true); rec = null; recLang = null; setBtn(); }
}
$('#bzh').onclick = () => start('zh');
$('#bid').onclick = () => start('id');

// 打字輸入：有中文字就當中文
$('#tf').onsubmit = e => {
  e.preventDefault(); unlockAudio();
  const t = $('#ti').value.trim(); if (!t) return;
  $('#ti').value = ''; $('#ti').blur();
  handle(t, /[㐀-鿿]/.test(t) ? 'zh' : 'id');
};

// ---------- 設定 ----------
const dlg = $('#dlg');
const showRate = () => $('#rv').textContent = Number($('#rate').value).toFixed(2) + 'x';
$('#set').onclick = () => { loadVoices(); $('#auto').checked = cfg.auto; $('#rate').value = cfg.rate; showRate(); dlg.showModal(); };
$('#rate').oninput = showRate;
function readCfg() { cfg = {auto: $('#auto').checked, rate: Number($('#rate').value), vid: $('#vid').value, vzh: $('#vzh').value}; store.set('cfg', cfg); }
$('#test').onclick = () => { unlockAudio(); readCfg(); speak('Halo, apa kabar? Senang bertemu dengan Anda.', 'id'); };
$('#ok').onclick = () => { readCfg(); dlg.close(); };

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
